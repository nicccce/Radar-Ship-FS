[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-ship-fs"
version = "0.0.0"
description = "Radar ship feature selection experiments based on Interactive RL Feature Selection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "mrmr-selection",  # COMP-007 mRMR baseline; version pinned in requirements.lock (RISK-004)
    "torch",  # trained-GCN encoder substrate (autodiff value heads + GCN); CPU-only, pinned in requirements.lock
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.15.21",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["data", "engine", "harness", "methods", "reward", "state", "trainers"]
py-modules = ["config", "metrics", "probe", "rng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
