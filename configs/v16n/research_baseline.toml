# Frozen protocol for new scientific comparisons. Historical configs remain unchanged.
schema_version = 1
algorithm_version = "stable_v1"

[dataset]
name = "radar_ship"
version = "v16n_2x_noise"
data_dir = "../dataset"
seeds = [42, 43, 44, 45, 46]
validation_fraction = 0.25
inner_cv_folds = 5
expected_clean_features = 65

[training]
steps = 250
discount = 0.9
learning_rate = 0.0003
batch_size = 32
replay_capacity = 2048
warmup_steps = 32
target_sync_interval = 25
gradient_clip_norm = 10.0
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_fraction = 0.7
checkpoint_interval = 25
hidden_layer_sizes = [128, 128]
activation = "relu"
correlation_penalty_weight = 0.02
feature_budget = 32
over_budget_penalty_weight = 0.0
reward_scheme = "dt_importance"
per_agent_credit = "reference"
neighbor_global_mix = 0.5
per_node_features = "summary_statistics"
state_pooling = "dt_importance"
gcn_hidden_dim = 4
gcn_layers = 1
hybrid_switch_step = 83
hybrid_withdraw_step = 166

[ppo]
initialization = "mi_ordered_accept"
evaluation_protocol = "shared_inner_cv"
episodes = 64
episodes_per_update = 16
learning_rate = 3e-4
ppo_epochs = 4
minibatch_size = 256
greedy_rollouts = 1
feature_budget = 32
correlation_penalty = 0.02
sparsity_bonus = 0.0
feature_id_seed = 0
feature_id_node_feature = false
feature_id_reward_weight = 0.0
archive_accuracy_tolerance = 0.0
archive_min_cv_gain = 0.0
max_swaps = 2
swap_candidate_pool = 4

[[methods]]
name = "mi_topk"
type = "classical"
encoder = "relevance_topk"

[[methods]]
name = "mi_ordered_accept"
type = "classical"
encoder = "mi_ordered_accept"

[[methods]]
name = "forward_greedy"
type = "classical"
encoder = "forward_greedy"

[[methods]]
name = "marlfs"
type = "dqn"
encoder = "minimal"

[[methods]]
name = "full_irfs_fixed"
type = "dqn"
encoder = "fixed"

[[methods]]
name = "gnn_ppo"
type = "ppo"
encoder = "gnn"

[output]
root = "experiments/research_baseline_v1"
resume = true
