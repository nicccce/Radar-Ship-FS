schema_version = 1
protocol_version = "improvement-replay-ppo-v1"

[dataset]
source_train = "../dataset/sim_ship_cr_v16n_2x_noise.train.svm"
source_train_sha256 = "2191fdc297aa49ce6a700df956ec44f68dc13e4c737937b31167543a203d22bb"
outer_partition = "experiments/k32_reward_robustness_v1/outer-partition.json"
outer_partition_sha256 = "62235d2fde916ce00cb4fdea0224a08339c9ac26226c43f294074c6160e1fea6"
source_test_open_count = 0
expected_rows = 3897
expected_original_features = 75
expected_clean_features = 65

[experiment]
outer_folds = [0, 1]
seeds = [2026092501, 2026092502, 2026092503]
feature_budget = 32
graph_threshold = 0.5
graph_seed_base = 20260915
inner_seed_base = 2026092201
random_start_salt = 20260922
physical_classifier_fit_limit = 110000
wall_time_limit_hours = 4.0

[search]
horizon = 8
training_episodes = 128
frozen_episodes = 32
episodes_per_update = 8
elite_size = 8
reward = "best_so_far"

[ppo]
hidden_dim = 64
learning_rate = 0.0003
gamma = 1.0
gae_lambda = 1.0
clip_ratio = 0.2
ppo_epochs = 4
minibatch_size = 64
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.05
prior_scale = 0.0
torch_threads = 1
device = "auto"

[scorer]
folds = 3
kernel = "rbf"
C = 1.0
gamma = 0.015384615384615385
class_weight = "balanced"
probability = false
tol = 0.001
cache_size = 256
max_iter = -1
shrinking = true

[replay]
steps = 16
batch_size = 64
capacity = 512

[refine]
enabled = false
steps = 64
reason = "Do not run steps64: the 16-step Replay-PPO policy already changed clearly (fixed-probe entropy 3.1132–3.3793, pool size 171–336) and mean paired outer BAcc improved +0.4877 pp. Expand this promising base version next; extra steps are not needed to address near-uniform actions."

[output]
root = "experiments/improvement_replay_ppo_v1"
smoke_root = "experiments/improvement_replay_ppo_smoke_v1"
report = "documents/research-plan/08b-improvement-replay-results.md"
