schema_version = 1
algorithm_version = "stable_v1"

[dataset]
name = "radar_ship"
version = "v16n"
data_dir = "../dataset"
seeds = [42]
validation_fraction = 0.25
inner_cv_folds = 5
expected_clean_features = 65

[training]
steps = 60
discount = 0.9
learning_rate = 0.0003
batch_size = 32
replay_capacity = 2048
warmup_steps = 32
target_sync_interval = 25
gradient_clip_norm = 10.0
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_fraction = 0.7
checkpoint_interval = 25
hidden_layer_sizes = [128, 128]
activation = "relu"
correlation_penalty_weight = 1.0
over_budget_penalty_weight = 0.0
reward_scheme = "dt_importance"
per_agent_credit = "reference"
neighbor_global_mix = 0.5
per_node_features = "summary_statistics"
state_pooling = "dt_importance"
gcn_hidden_dim = 4
gcn_layers = 1
hybrid_switch_step = 20
hybrid_withdraw_step = 40

[ppo]
episodes = 16
episodes_per_update = 4
learning_rate = 3e-4
ppo_epochs = 4
minibatch_size = 128
greedy_rollouts = 1
feature_budget = 32

[[methods]]
name = "relevance_topk"
type = "classical"
encoder = "relevance_topk"

[[methods]]
name = "dt_rfe"
type = "classical"
encoder = "dt_rfe"

[[methods]]
name = "mrmr"
type = "classical"
encoder = "mrmr"

[[methods]]
name = "l1"
type = "classical"
encoder = "l1"

[[methods]]
name = "gnn_ppo"
type = "ppo"
encoder = "gnn"

[[methods]]
name = "full_irfs_fixed"
type = "dqn"
encoder = "fixed"

[output]
root = "experiments/test_all"
resume = true
